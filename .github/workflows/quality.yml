name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate source and database migrations
        run: |
          npm run check
      - name: Smoke test deployed production website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/smoke_test.py