name: Background video renderer

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: shortsflow-background-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Test the FFmpeg pipeline on pushes
        if: github.event_name == 'push'
        run: python3 scripts/test_background_render.py
      - name: Process one queued render
        env:
          SHORTSFLOW_RENDER_WORKER: https://shortsflow-analysis-engine.inipastiuy-41f.workers.dev
        run: python3 scripts/background_render.py
