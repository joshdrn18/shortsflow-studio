name: Background video renderer
# Keep a periodic safety net; pushes also drain the queue immediately.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [render-queued]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: shortsflow-background-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
      - name: Test the FFmpeg pipeline on pushes
        if: github.event_name == 'push'
        run: python3 scripts/test_background_render.py
      - name: Drain queued renders (up to four)
        env:
          SHORTSFLOW_RENDER_WORKER: https://shortsflow-analysis-engine.inipastiuy-41f.workers.dev
        run: python3 scripts/background_render.py
